name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Nothing here reaches the database or the AI provider, so no secrets are
      # needed and the run cannot touch production data.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
